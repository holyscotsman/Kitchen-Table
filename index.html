<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Kitchen Table</title>
    <meta
      name="description"
      content="Everything Mom cooks, in one place."
    />

    <!-- Theme is resolved before first paint so a dark-mode user never sees a
         white flash on load. Dark is the default. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("kt.theme");
          if (saved === "light") {
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (e) {}
      })();
    </script>

    <!-- Atkinson Hyperlegible is self-hosted (fonts/): no third-party request
         on the critical path, and the page paints in the right face even when
         the wider internet is unreachable. OFL-licensed; see fonts/OFL.txt. -->
    <link
      rel="preload"
      href="fonts/atkinson-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/atkinson-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="fonts/fonts.css" />

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="style.css" />
    <meta name="theme-color" content="#0E1712" />
    <meta name="apple-mobile-web-app-title" content="Kitchen Table" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <div id="app">
      <p class="boot">Loading recipes…</p>
    </div>

    <!-- Announces the screen after a hash navigation, which otherwise passes
         silently for a screen reader. -->
    <p id="route-live" class="vh" role="status" aria-live="polite"></p>

    <script src="app.js"></script>
  </body>
</html>
