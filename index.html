<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Kitchen Table</title>
    <meta
      name="description"
      content="Everything Mom cooks, in one place."
    />

    <!-- Theme is resolved before first paint so a dark-mode user never sees a
         white flash on load. Dark is the default. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("kt.theme");
          if (saved === "light") {
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="style.css" />
    <meta name="theme-color" content="#0E1712" />
    <meta name="apple-mobile-web-app-title" content="Kitchen Table" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <div id="app">
      <p class="boot">Loading recipes…</p>
    </div>

    <script src="app.js"></script>
  </body>
</html>
