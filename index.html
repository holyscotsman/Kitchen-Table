<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Kitchen Table</title>

    <!-- The policy is as tight as the app's real behaviour allows (gameplan
         052). The loose-looking lines are load-bearing, not lazy:
           connect-src https:  - link import fetches whatever recipe page the
                                 user pastes, directly first, relays after, and
                                 OCR pulls its wasm + language data at runtime;
           script-src jsdelivr - Tesseract, pinned + SRI'd where it's loaded;
           worker-src blob:    - Tesseract builds its worker from a blob;
           img/media data: blob: - photos live as data URLs, downloads as blobs;
           style 'unsafe-inline' - the renderer sets style="" attributes (font
                                 stepping); element styles stay in the sheets.
         The two inline scripts (the pre-paint theme, and the last-resort
         boot message below) are each admitted by their own hash - change
         either one and rehash it, or it silently stops running. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval' 'sha256-o1OJtOYup8CcPW/GTXWqN/q4fHOREV9wzGW+rZoycms=' 'sha256-Z16yHOTWV/Wfnoo+EH2LJkzOgCYVpsGar2ueJcLaG7Q='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https:; worker-src 'self' blob:; media-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta
      name="description"
      content="Everything Mom cooks, in one place."
    />

    <!-- Theme is resolved before first paint so a dark-mode user never sees a
         white flash on load. Dark is the default. -->
    <script>
      (function () {
        try {
          /* app.js stores JSON, so the value arrives as '"light"' — quoted.
             The bare form is accepted too in case anything ever wrote it raw. */
          var saved = localStorage.getItem("kt.theme");
          if (saved === '"light"' || saved === "light") {
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (e) {}
      })();
    </script>

    <!-- The last-resort message. Every other failure in this app has a
         sentence; the one that never did was the worst of them. If app.js is
         truncated by a bad deploy, or uses syntax an older iPhone cannot
         parse, nothing runs — no catch, no render — and this page reads
         "Loading recipes…" for ever, which on the phone this book was built
         for looks like a broken phone rather than a broken deploy.
         Inline on purpose: a separate file could fail the same way app.js
         just did. Admitted by its own hash in the policy above — change this
         script and rehash it, or the page boots without its safety net. -->
    <script>
      (function () {
        function down() {
          var app = document.getElementById("app");
          if (!app || app.getAttribute("data-booted") === "1") return;
          app.textContent = "";
          var p = document.createElement("p");
          p.className = "boot";
          p.textContent = "Kitchen Table could not start on this phone. " +
            "It is not something you did — try again, and if it keeps " +
            "happening the app needs a fix rather than you.";
          var wrap = document.createElement("p");
          wrap.className = "boot";
          var b = document.createElement("button");
          b.type = "button";
          b.className = "bigbtn press";
          b.textContent = "Try again";
          b.addEventListener("click", function () { location.reload(); });
          wrap.appendChild(b);
          app.appendChild(p);
          app.appendChild(wrap);
        }
        /* A syntax error or a synchronous throw says so at once; anything
           slower (a script that never arrives) falls to the timer. */
        window.addEventListener("error", function (e) {
          if (e && e.filename && e.filename.indexOf("app.js") > -1) down();
        });
        setTimeout(down, 8000);
      })();
    </script>

    <!-- Atkinson Hyperlegible is self-hosted (fonts/): no third-party request
         on the critical path, and the page paints in the right face even when
         the wider internet is unreachable. OFL-licensed; see fonts/OFL.txt. -->
    <link
      rel="preload"
      href="fonts/atkinson-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/atkinson-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="fonts/fonts.css" />

    <!-- Warm the path to the kitchen server (video imports) so the first
         interaction skips DNS + TLS setup. Nothing is requested here. -->
    <link
      rel="preconnect"
      href="https://kitchen-table-5tp6.onrender.com"
      crossorigin
    />

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- The manifest exists for one capability: Android's share sheet can
         send a video link straight into the app (share_target). Its two
         colour values mirror tokens.css --bg dark, same as the theme-color
         meta below — a manifest cannot read CSS variables. -->
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="style.css" />
    <meta name="theme-color" content="#0E1712" />
    <meta name="apple-mobile-web-app-title" content="Kitchen Table" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <div id="app">
      <p class="boot">Loading recipes…</p>
    </div>

    <!-- Announces the screen after a hash navigation, which otherwise passes
         silently for a screen reader. -->
    <p id="route-live" class="vh" role="status" aria-live="polite"></p>

    <script src="app.js"></script>
  </body>
</html>
