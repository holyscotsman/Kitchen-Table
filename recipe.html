<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kitchen Table</title>
    <!-- The site moved to hash routing (#<recipe-id>). This stub keeps any
         older bookmark of recipe.html?id=… working instead of 404ing. -->
    <script>
      (function () {
        var id = new URLSearchParams(location.search).get("id");
        location.replace("index.html" + (id ? "#" + encodeURIComponent(id) : ""));
      })();
    </script>
  </head>
  <body>
    <p>Taking you to the recipe… <a href="index.html">Kitchen Table</a></p>
  </body>
</html>
