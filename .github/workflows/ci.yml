# Gameplan task 003: every pull request runs the full check suite before merge.
# The app has no build step — CI serves the repo root exactly as GitHub Pages
# would and drives it with the suites in tests/.
name: checks

on:
  pull_request:
  push:
    branches: [main]

# This workflow runs the repository's own code — npm dependencies, a browser,
# the suites — on every pull request. Nothing it does needs write access, and
# a workflow that runs code with a write-capable token is the ordinary shape
# of a supply-chain problem. Stated here rather than left to the repository
# default, which is a settings page someone can change without reading this.
permissions:
  contents: read

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `R127` — the write endpoint's SQL decides whether one person's recipe
    # can be written over by another's of the same name, and no amount of
    # reading its source answers that. A throwaway Postgres lets the shipped
    # statement be run for real on every pull request.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kt
          POSTGRES_PASSWORD: kt
          POSTGRES_DB: kt_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The checkout credential otherwise stays in .git/config for every
          # later step to find. CI never pushes, so it never needs one.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      # The Chromium download is the slowest part of every run — cache it
      # keyed on the Playwright version, so only a version bump re-fetches.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      # apt can stall on a lock or a slow mirror — and did, hanging a whole
      # 30-minute run before a single test executed. Bounded, so a bad day
      # costs eight minutes. If the libraries really are missing, the suites
      # fail loudly at browser launch rather than hanging here in silence.
      - name: Install system libraries for Chromium
        working-directory: tests
        timeout-minutes: 8
        continue-on-error: true
        run: npx playwright install-deps chromium

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: tests
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: Run all suites
        working-directory: tests
        run: bash run.sh

      # Kept out of run.sh because it needs something a laptop may not have.
      # KT_SQL_REQUIRED turns a skip into a failure here, where the database
      # is guaranteed — a gate that silently does nothing is worse than none.
      - name: Run the SQL gate against a real Postgres
        env:
          KT_TEST_DB: postgres://kt:kt@127.0.0.1:5432/kt_test
          KT_SQL_REQUIRED: '1'
        run: node tests/sql-live.js
