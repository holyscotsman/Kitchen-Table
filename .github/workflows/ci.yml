# Gameplan task 003: every pull request runs the full check suite before merge.
# The app has no build step — CI serves the repo root exactly as GitHub Pages
# would and drives it with the suites in tests/.
name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      # The Chromium download is the slowest part of every run — cache it
      # keyed on the Playwright version, so only a version bump re-fetches.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}

      - name: Install Playwright
        working-directory: tests
        run: |
          npm ci
          npx playwright install-deps chromium
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install chromium
          fi

      - name: Run all suites
        working-directory: tests
        run: bash run.sh
