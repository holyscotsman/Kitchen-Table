# Keeps recipes.json and the Neon database telling the same story.
#
# Nightly (and on demand from the Actions tab): if the database has drifted
# from the file, regenerate recipes.json from the database and commit it —
# the database is the canonical shared copy (DECISIONS.md 026, as reversed).
#
# Needs one repository secret: KT_DB — the Postgres connection string.
# Settings → Secrets and variables → Actions → New repository secret.

name: db-sync
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-save @neondatabase/serverless
      - name: Compare database and file
        id: check
        env:
          KT_DB: ${{ secrets.KT_DB }}
        run: |
          if [ -z "$KT_DB" ]; then
            # Loud, not polite. An unconfigured sync used to report success and
            # do nothing — which is exactly how it went unnoticed for a
            # fortnight while video imports piled up in the database and never
            # reached recipes.json. A warning annotation and a summary line
            # make "not wired up" look different from "nothing to do".
            echo "::warning title=db-sync is not wired up::KT_DB is not set, so the database was never read. Recipes accepted from video imports will not reach recipes.json until this secret exists (Settings → Secrets and variables → Actions)."
            echo "⚠️ **Skipped: \`KT_DB\` secret is not set.** The database was never read, so nothing could sync. Add it under Settings → Secrets and variables → Actions." >> "$GITHUB_STEP_SUMMARY"
            echo "drift=skip" >> "$GITHUB_OUTPUT"
          else
            set +e
            node db/export.js --check
            code=$?
            set -e
            # 0 = identical, 2 = genuinely drifted. Anything else is the
            # database being unreachable or the query failing, which must not
            # be mistaken for "drifted, go ahead and rewrite the file".
            if [ "$code" -eq 0 ]; then
              echo "✅ Database and \`recipes.json\` already agree — nothing to sync." >> "$GITHUB_STEP_SUMMARY"
              echo "drift=no" >> "$GITHUB_OUTPUT"
            elif [ "$code" -eq 2 ]; then
              echo "📥 Database has drifted from \`recipes.json\` — committing the regenerated file." >> "$GITHUB_STEP_SUMMARY"
              echo "drift=yes" >> "$GITHUB_OUTPUT"
            else
              echo "::error title=db-sync could not read the database::db/export.js --check exited $code. The file was not touched."
              echo "❌ **Could not read the database** (exit $code). \`recipes.json\` was left alone." >> "$GITHUB_STEP_SUMMARY"
              exit "$code"
            fi
          fi
      - name: Export and commit
        if: steps.check.outputs.drift == 'yes'
        env:
          KT_DB: ${{ secrets.KT_DB }}
        run: |
          # export.js exits 3 rather than writing a book that lost most of
          # itself — an empty or half-migrated database must not become a
          # commit at 06:17 with nobody watching.
          set +e
          node db/export.js
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "::error title=db-sync refused to write::The database returned far fewer recipes than recipes.json holds. Nothing was committed."
            echo "🛑 **Refused to write.** The database returned far fewer recipes than \`recipes.json\` holds, so nothing was committed. Check \`KT_DB\`; re-run with \`--force\` locally if the loss is deliberate." >> "$GITHUB_STEP_SUMMARY"
            exit 3
          fi
          [ "$code" -eq 0 ] || exit "$code"
          git config user.name "kitchen-table-sync"
          git config user.email "actions@users.noreply.github.com"
          git add recipes.json
          git commit -m "Sync recipes.json from the database"
          git push
